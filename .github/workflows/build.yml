name: Build Windows Executable

# Baut automatisch eine fertige Windows-.exe.
# - Bei jedem Push auf den Branch: als herunterladbares "Artifact"
#   (Actions-Tab → letzter Run → Abschnitt "Artifacts").
# - Bei einem Tag wie v1.0: zusätzlich als GitHub-Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: >
          pyinstaller --onefile --name Lerntrainer --windowed
          --add-data "src;src"
          --hidden-import customtkinter --hidden-import PIL
          --hidden-import fitz --hidden-import pypdf
          --hidden-import pptx --hidden-import docx
          --collect-all customtkinter
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lerntrainer-Windows
          path: dist/Lerntrainer.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lerntrainer.exe
