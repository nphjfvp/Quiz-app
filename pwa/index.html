<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Lerntrainer – Quiz & Lern-App, offline-fähig">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Lerntrainer</title>
  <script>
    // Theme sofort anwenden (vor dem Rendern), um Flackern zu vermeiden.
    // "auto" = Systemvorgabe (kein data-theme gesetzt).
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="header">
    <h1>🎓 Lerntrainer</h1>
    <small>Dein persönlicher Lern-Begleiter</small>
  </header>
  <main id="app">
    <div class="empty" style="padding-top:60px">Wird geladen…</div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
